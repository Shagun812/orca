version: '3.8'

services:
  postgres-postgis:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: oilwatch
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oilwatch_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
